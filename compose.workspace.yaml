# Local simulation development. Paths are runtime bind mounts, not build args.
x-workspace-image: &workspace-image
  image: ${IMAGE_PREFIX:-curtmini-piper}-workspace:${CONTAINER_ROS_DISTRO:-jazzy}-${RMW:-cyclonedds}
  build:
    context: .
    dockerfile: images/workspace/Dockerfile
    target: runtime
    args:
      ROS_DISTRO: ${CONTAINER_ROS_DISTRO:-jazzy}
      ROS_IMAGE: ${ROS_IMAGE:-ros:${CONTAINER_ROS_DISTRO:-jazzy}-ros-base-noble}
      RMW: ${RMW:-cyclonedds}

x-install: &install
  type: volume
  source: workspace-install
  target: /opt/ws/install
  read_only: true
  volume:
    nocopy: true

services:
  workspace-builder:
    <<: *workspace-image
    profiles: [workspace]
    entrypoint: [/opt/container/workspace-build.sh]
    command: []
    volumes:
      - type: bind
        source: ${CURT_MINI_SOURCE:-../rob4_fraunhofer_ws/src/curt_mini}
        target: /opt/ws/src/curt_mini
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CURTMINI_PIPER_SOURCE:-../rob4_fraunhofer_ws/src/curtmini_piper}
        target: /opt/ws/src/curtmini_piper
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${AGX_ARM_URDF_SOURCE:-../rob4_fraunhofer_ws/src/piper_driver/agx_arm_urdf}
        target: /opt/ws/src/agx_arm_urdf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CURTMINI_PIPER_GZ_SIM_SOURCE:-../rob4_fraunhofer_ws/src/curtmini_piper_simulation/curtmini_piper_gz_sim}
        target: /opt/ws/src/curtmini_piper_gz_sim
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${NEO_GZ_WORLDS_SOURCE:-../rob4_fraunhofer_ws/src/curtmini_piper_simulation/neo_gz_worlds}
        target: /opt/ws/src/neo_gz_worlds
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./locks/${CONTAINER_ROS_DISTRO:-jazzy}
        target: /opt/locks
        read_only: true
      - workspace-dependencies:/opt/ws/dependencies
      - workspace-build:/opt/ws/build
      - workspace-install:/opt/ws/install
      - workspace-log:/opt/ws/log
  gz-sim:
    <<: *workspace-image
    environment:
      REQUIRE_WORKSPACE_INSTALL: "1"
    volumes: [*install]
  moveit-rviz-sim:
    <<: *workspace-image
    environment:
      REQUIRE_WORKSPACE_INSTALL: "1"
    volumes: [*install]
  real-bringup:
    environment:
      REQUIRE_WORKSPACE_INSTALL: "1"
    volumes: [*install]
  piper-bringup:
    environment:
      REQUIRE_WORKSPACE_INSTALL: "1"
    volumes: [*install]
  moveit-rviz-hardware:
    environment:
      REQUIRE_WORKSPACE_INSTALL: "1"
    volumes: [*install]
  moveitpy-sim:
    <<: *workspace-image
    environment:
      REQUIRE_WORKSPACE_INSTALL: "1"
    volumes: [*install]
  moveitpy-hardware:
    environment:
      REQUIRE_WORKSPACE_INSTALL: "1"
    volumes: [*install]

volumes:
  workspace-dependencies:
    name: ${COMPOSE_PROJECT_NAME:-curtmini-piper}-workspace-dependencies-${CONTAINER_ROS_DISTRO:-jazzy}
  workspace-build:
    name: ${COMPOSE_PROJECT_NAME:-curtmini-piper}-workspace-build-${CONTAINER_ROS_DISTRO:-jazzy}-${RMW:-cyclonedds}
  workspace-install:
    name: ${COMPOSE_PROJECT_NAME:-curtmini-piper}-workspace-install-${CONTAINER_ROS_DISTRO:-jazzy}-${RMW:-cyclonedds}
  workspace-log:
    name: ${COMPOSE_PROJECT_NAME:-curtmini-piper}-workspace-log-${CONTAINER_ROS_DISTRO:-jazzy}-${RMW:-cyclonedds}
