# CycloneDDS communication settings for the application services below.
# Service names match those defined in the robot, simulator, and tools Compose
# files, which the root compose.yaml includes. This file adds settings to those
# services; it does not start all of them or define their images and commands.
#
# Select this file once in .env, for example:
# RMW=cyclonedds
# COMPOSE_FILE=compose.yaml:compose.cyclonedds.yaml:compose.gui.yaml
# Then choose services by name: docker compose up piper-bringup moveit-rviz-hardware
# See README_compose_service.md for the service reference.
# workspace-builder is in compose.workspace.yaml; it builds code and needs no DDS
# configuration. zenoh-router belongs to the alternative compose.zenoh.yaml.

x-cyclonedds-environment: &cyclonedds-environment
  CYCLONEDDS_URI: file:///etc/curtmini-piper/cyclonedds.xml

x-cyclonedds-volume: &cyclonedds-volume
  type: bind
  source: ./config/cyclonedds/cyclonedds.xml
  target: /etc/curtmini-piper/cyclonedds.xml
  read_only: true

services:
  apriltag-base:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  tag-pose-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  nav2-goal-client:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Gazebo simulation: robot, simulated controllers and MoveIt server.
  gz-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Real Curt Mini base hardware; Piper arm runs in piper-bringup.
  base-bringup:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  realsense-base:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  realsense-tool:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Real Piper arm and MoveIt, without base, IMU or joystick.
  piper-bringup:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # MoveIt RViz window for viewing and planning arm motions in simulation.
  moveit-rviz-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # MoveIt RViz window connected to piper-bringup.
  moveit-rviz-hardware:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Python example for planning or executing simulated arm motions.
  moveitpy-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Python example for the real arm; plans only unless execution is enabled.
  moveitpy-hardware:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  moveit-action-client-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  moveit-action-client-hardware:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Interactive keyboard control of the simulated mobile base.
  keyboard-teleop-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Interactive keyboard control of the real mobile base through its command mux.
  keyboard-teleop-hardware:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Interactive shell with ROS tools for inspecting nodes, topics and services.
  ros-cli:
    user: "${ROS_CLI_UID:-1000}:${ROS_CLI_GID:-1000}"
    working_dir: /diagnostics
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume
      - type: bind
        source: ${ROS_CLI_OUTPUT_DIR:-./diagnostics}
        target: /diagnostics
        bind:
          create_host_path: false

  # SLAM Toolbox: builds a map from the simulated lidar while you drive.
  mapping-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # AMCL and Nav2: localizes on a saved map and drives to goal poses.
  nav2-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume

  # Navigation RViz window: map, lidar, initial-pose and goal tools.
  nav2-rviz-sim:
    environment:
      <<: *cyclonedds-environment
    volumes:
      - *cyclonedds-volume
